# Weekly PRs when a GitHub Action used by the workflows publishes a new version
# (this is how the Node 20 deprecation would have been caught early).
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          dev-dependencies:
              dependency-type: development
