name: Channel maintenance

# Runs the whole maintenance chain (health check -> CORS/segment check -> YouTube
# fallbacks -> https upgrade -> prune) and pushes the diff to a branch for review.
# Manual only (Actions -> Channel maintenance -> Run workflow): run it every few
# weeks. It opens a PR when the org allows Actions to create PRs; otherwise the run
# summary lists the retired channels and links a ready-made "Compare & pull request".

on:
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: channel-maintenance
    cancel-in-progress: false

jobs:
    refresh:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            # Health check first: everything downstream reads check_results.json.
            - name: Check stream health
              run: node tools/report_status_channels.js --timeout=10000

            # Un servidor puede responder 200 a Node y seguir siendo inservible en el
            # navegador si no manda Access-Control-Allow-Origin: eso solo lo ve esta
            # comprobación, y el prune la usa igual que la de alcanzabilidad.
            - name: Check browser (CORS) usability
              run: node tools/check_cors_channels.js --timeout=10000

            # Merge before pruning: a channel that gains a YouTube fallback here
            # survives the prune instead of being retired for a dead m3u8.
            - name: Merge YouTube fallbacks
              run: node tools/merge_youtube_from_json_teles.js

            - name: Upgrade or retire plain-http streams
              run: node tools/upgrade_insecure_streams.js --timeout=10000

            - name: Prune channels with no working signal
              run: node tools/prune_dead_channels.js

            - name: Validate JSON
              run: node tools/validate_json_light.js

            - name: Push the diff and open a pull request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if git diff --quiet -- json-tv/; then
                    echo "No channel changes." | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  # Channels this run retires, for the summary / PR body.
                  RETIRED=$(node -e '
                    const { execSync } = require("child_process");
                    const before = JSON.parse(execSync("git show HEAD:json-tv/tv-channels.json"));
                    const after = require("./json-tv/tv-channels.json");
                    const gone = Object.keys(before).filter((id) => !(id in after));
                    console.log(gone.map((id) => `- ${id} (${before[id].name})`).join("\n") || "- none");
                  ')
                  ACTIVE=$(node -p "Object.keys(require('./json-tv/tv-channels.json')).length")

                  BRANCH="chore/channel-maintenance-$(date -u +%Y-%m-%d)"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$BRANCH"
                  git add json-tv/
                  git commit -m "chore: channel maintenance ($(date -u +%Y-%m-%d))"
                  git push --force origin "$BRANCH"

                  BODY="Automated channel maintenance. Active channels after this run: $ACTIVE.

                  Retired to inactive.json:
                  $RETIRED

                  Review before merging: a channel can fail from the runner's (US) network and still work for viewers."

                  COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
                  {
                    echo "## Channel maintenance"
                    echo
                    echo "$BODY"
                    echo
                  } >> "$GITHUB_STEP_SUMMARY"

                  if gh pr create --title "chore: channel maintenance ($(date -u +%Y-%m-%d))" \
                      --body "$BODY" --head "$BRANCH" --base main; then
                    echo "Pull request opened." >> "$GITHUB_STEP_SUMMARY"
                  else
                    # The org does not let Actions create PRs: leave a one-click link instead of failing.
                    echo "::notice::Actions may not open PRs here. Open it from: $COMPARE"
                    echo "**[Open the pull request]($COMPARE)** (Actions may not create PRs in this org)." >> "$GITHUB_STEP_SUMMARY"
                  fi
